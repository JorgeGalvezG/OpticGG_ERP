name: frontend
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  fl_chart: ^1.2.0
  http: ^1.2.0                 # Para conectarnos al Spring Boot
  provider: ^6.1.2    # Manejo de estado (Rendimiento top)
  pdf: ^3.11.0
  printing: ^5.12.0
  shared_preferences: ^2.2.2   # Para guardar el Token y no pedir login a cada rato
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  image_picker: ^1.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.jpg"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.jpg"
  image_path: "assets/icon/app_icon.jpg"
  web:
    generate: true
    image_path: "assets/icon/app_icon.jpg"

flutter:

  uses-material-design: true
