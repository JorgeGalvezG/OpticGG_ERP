spring.application.name=OpticgAPI

# 1. Le decimos a Spring que lea el archivo secreto
spring.config.import=optional:classpath:application-secrets.properties

# 2. Inyectamos las variables de forma segura
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=America/Lima
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACION JPA E HIBERNATE
# ===============================
# Como ya creaste las tablas en TiDB, le decimos que no intente tocarlas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ===============================
# CONFIGURACION DE FLYWAY
# ===============================
# IMPORTANTE: Como creaste las tablas a mano en TiDB hace un momento,
# apagamos Flyway temporalmente para que no choque con tus tablas manuales.
spring.flyway.enabled=false