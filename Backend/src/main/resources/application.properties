spring.application.name=OpticgAPI

# 1. Le decimos a Spring que lea el archivo secreto
spring.config.import=optional:classpath:application-secrets.properties

# 2. Inyectamos las variables de forma segura
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:opticGG}?serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACION JPA E HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===============================
# CONFIGURACION DE FLYWAY
# ===============================
spring.flyway.enabled=false

# Configuración de Servidor
server.port=8080
